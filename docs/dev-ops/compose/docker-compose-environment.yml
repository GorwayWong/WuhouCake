services:
  postgres:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    command: ["postgres", "-c", "shared_buffers=${POSTGRES_SHARED_BUFFERS:-64MB}", "-c", "max_connections=${POSTGRES_MAX_CONNECTIONS:-24}", "-c", "work_mem=${POSTGRES_WORK_MEM:-2MB}", "-c", "temp_file_limit=${POSTGRES_TEMP_FILE_LIMIT:-64MB}"]
    mem_limit: ${POSTGRES_MEM_LIMIT:-256m}
    cpus: ${POSTGRES_CPUS:-0.75}
    pids_limit: ${POSTGRES_PIDS_LIMIT:-64}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  redis:
    image: redis:7-bookworm
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?required}", "--maxmemory", "${REDIS_MAXMEMORY:-32mb}", "--maxmemory-policy", "noeviction"]
    mem_limit: ${REDIS_MEM_LIMIT:-96m}
    cpus: ${REDIS_CPUS:-0.35}
    pids_limit: ${REDIS_PIDS_LIMIT:-32}
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$${REDIS_PASSWORD}\" redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
volumes:
  postgres-data:
  redis-data:
networks:
  default:
    name: ${COMPOSE_PROJECT_NAME:-wuhoucake}-network
