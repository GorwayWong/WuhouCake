services:
  app:
    image: ${APP_IMAGE:?APP_IMAGE is required}
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:?POSTGRES_DB is required}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:?POSTGRES_USER is required}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      DB_POOL_MAX_SIZE: ${DB_POOL_MAX_SIZE:-5}
      IMAGE_WORKER_URL: http://image-worker:8091/process
      JAVA_TOOL_OPTIONS: -Xms64m -Xmx256m -XX:MaxDirectMemorySize=24m -XX:MaxMetaspaceSize=136m -XX:ReservedCodeCacheSize=48m -Xss512k -XX:ActiveProcessorCount=2 -XX:+ExitOnOutOfMemoryError -Xlog:gc,safepoint:stdout:time,uptime,level,tags
      APP_TEMP_DIR: /run/wuhou-scratch
      SPRING_SERVLET_MULTIPART_LOCATION: /run/wuhou-scratch
      TZ: Asia/Shanghai
      IDENTITY_PRIVATE_KEY: /run/identity/private.pem
      IDENTITY_PUBLIC_KEY: /run/identity/public.pem
      CUSTOMER_ENTRY_PUBLIC_ORIGIN: ${CUSTOMER_ENTRY_PUBLIC_ORIGIN:?CUSTOMER_ENTRY_PUBLIC_ORIGIN is required}
      CUSTOMER_ENTRY_PER_MINUTE: ${CUSTOMER_ENTRY_PER_MINUTE:-10}
      CUSTOMER_ENTRY_PER_HOUR: ${CUSTOMER_ENTRY_PER_HOUR:-100}
      CUSTOMER_ENTRY_MAX_BODY_BYTES: ${CUSTOMER_ENTRY_MAX_BODY_BYTES:-131072}
      CUSTOMER_ENTRY_TRUSTED_PROXIES: ${CUSTOMER_ENTRY_TRUSTED_PROXIES:-}
    volumes:
      - type: bind
        source: ${APP_TEMP_DIR:?dedicated scratch mount is required}
        target: /run/wuhou-scratch
        bind:
          create_host_path: false
      - ${IDENTITY_KEY_DIR:?IDENTITY_KEY_DIR is required}:/run/identity:ro
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8080"
    init: true
    mem_limit: 640m
    cpus: 1.5
    pids_limit: 160
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
  image-worker:
    image: ${APP_IMAGE:?APP_IMAGE is required}
    entrypoint: ["java", "-Xms8m", "-Xmx24m", "-XX:MaxMetaspaceSize=24m", "-XX:MaxDirectMemorySize=4m", "-XX:ReservedCodeCacheSize=8m", "-Xss512k", "-XX:+UseSerialGC", "-XX:CICompilerCount=2", "-XX:ActiveProcessorCount=1", "-XX:+ExitOnOutOfMemoryError", "-Djdk.httpserver.maxConnections=12", "-Dsun.net.httpserver.maxReqTime=12", "-Dsun.net.httpserver.maxRspTime=15", "-Dsun.net.httpserver.timerMillis=1000", "-cp", "/app/image-worker/*", "org.xaspire.WuhouCake.order.infrastructure.files.ImageWorkerServer"]
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs: ["/tmp:size=16m,mode=1777"]
    mem_limit: 320m
    cpus: 1
    pids_limit: 64
    healthcheck:
      test: ["CMD", "wget", "-q", "-T", "2", "--spider", "http://127.0.0.1:8091/health"]
      start_period: 10s
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: "3"}
networks:
  default:
    name: ${COMPOSE_PROJECT_NAME:-wuhoucake}-network
    external: true
