name: wuhou-ip

x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

services:
  postgres:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: wuhou
      POSTGRES_USER: wuhou
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
    command: ["postgres", "-c", "shared_buffers=${POSTGRES_SHARED_BUFFERS:-64MB}", "-c", "max_connections=${POSTGRES_MAX_CONNECTIONS:-24}", "-c", "work_mem=${POSTGRES_WORK_MEM:-2MB}", "-c", "temp_file_limit=${POSTGRES_TEMP_FILE_LIMIT:-64MB}"]
    mem_limit: ${POSTGRES_MEM_LIMIT:-256m}
    cpus: ${POSTGRES_CPUS:-0.75}
    pids_limit: ${POSTGRES_PIDS_LIMIT:-64}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wuhou -d wuhou"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped
    logging: *logging
  redis:
    image: redis:7-bookworm
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?required}
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?required}", "--maxmemory", "${REDIS_MAXMEMORY:-32mb}", "--maxmemory-policy", "noeviction"]
    mem_limit: ${REDIS_MEM_LIMIT:-96m}
    cpus: ${REDIS_CPUS:-0.35}
    pids_limit: ${REDIS_PIDS_LIMIT:-32}
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$${REDIS_PASSWORD}\" redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped
    logging: *logging
  app:
    image: ${APP_IMAGE:?required}
    user: "${APP_UID:?required}:${APP_GID:?required}"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/wuhou
      SPRING_DATASOURCE_USERNAME: wuhou
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?required}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD:?required}
      IDENTITY_PRIVATE_KEY: /run/identity/private.pem
      IDENTITY_PUBLIC_KEY: /run/identity/public.pem
      CUSTOMER_ENTRY_PUBLIC_ORIGIN: https://${PUBLIC_IP:?required}
      DB_POOL_MAX_SIZE: 5
      IMAGE_WORKER_URL: http://image-worker:8091/process
      JAVA_TOOL_OPTIONS: -Xms64m -Xmx256m -XX:MaxDirectMemorySize=24m -XX:MaxMetaspaceSize=136m -XX:ReservedCodeCacheSize=48m -Xss512k -XX:ActiveProcessorCount=2 -XX:+ExitOnOutOfMemoryError -Xlog:gc,safepoint:stdout:time,uptime,level,tags
      TZ: Asia/Shanghai
    volumes:
      - ./keys:/run/identity:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
    init: true
    mem_limit: 640m
    cpus: 1.5
    pids_limit: 160
    restart: unless-stopped
    logging: *logging
  image-worker:
    image: ${APP_IMAGE:?required}
    entrypoint: ["java", "-Xms8m", "-Xmx24m", "-XX:MaxMetaspaceSize=24m", "-XX:MaxDirectMemorySize=4m", "-XX:ReservedCodeCacheSize=8m", "-Xss512k", "-XX:+UseSerialGC", "-XX:CICompilerCount=2", "-XX:ActiveProcessorCount=1", "-XX:+ExitOnOutOfMemoryError", "-Djdk.httpserver.maxConnections=12", "-Dsun.net.httpserver.maxReqTime=12", "-Dsun.net.httpserver.maxRspTime=15", "-Dsun.net.httpserver.timerMillis=1000", "-cp", "/app/image-worker/*", "org.xaspire.WuhouCake.order.infrastructure.files.ImageWorkerServer"]
    user: "${APP_UID:?required}:${APP_GID:?required}"
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs: ["/tmp:size=16m,mode=1777"]
    mem_limit: 320m
    cpus: 1
    pids_limit: 64
    healthcheck:
      test: ["CMD", "wget", "-q", "-T", "2", "--spider", "http://127.0.0.1:8091/health"]
      start_period: 10s
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped
    logging: *logging
  gateway:
    image: ${GATEWAY_IMAGE:-caddy:2.10.2-alpine}
    environment:
      PUBLIC_IP: ${PUBLIC_IP:?required}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./gateway:/etc/caddy:ro
      - ${RELEASE_DIR:?required}/dist:/srv:ro
      - ./acme:/var/www/acme:ro
      - ./letsencrypt:/etc/letsencrypt:ro
    mem_limit: 64m
    restart: unless-stopped
    logging: *logging
  certbot:
    image: certbot/certbot:v5.4.0
    profiles: ["ops"]
    volumes:
      - ./acme:/var/www/acme
      - ./letsencrypt:/etc/letsencrypt
    mem_limit: 192m
    logging: *logging

volumes:
  postgres-data:
  redis-data:
