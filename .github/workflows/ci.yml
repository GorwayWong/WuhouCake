name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests and integration
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_DB: wuhoucake_ci
          POSTGRES_USER: wuhoucake
          POSTGRES_PASSWORD: ci-postgres-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wuhoucake -d wuhoucake_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/wuhoucake_ci
      SPRING_DATASOURCE_USERNAME: wuhoucake
      SPRING_DATASOURCE_PASSWORD: ci-postgres-password
      SPRING_DATA_REDIS_HOST: localhost
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_PASSWORD: ""
      RECOGNITION_ASSIST_ENABLED: "false"
      DASHSCOPE_API_KEY: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Verify local backup and deployment contracts
        run: |
          python3 -B docs/dev-ops/compose/test-backup-ip-database.py
          python3 docs/dev-ops/compose/test-deploy-ip.py
          python3 docs/dev-ops/compose/test-resource-config.py
      - name: Verify Prometheus alert rules
        run: docker run --rm --network none -v "$PWD/docs/dev-ops/monitoring:/rules:ro" -w /rules --entrypoint /bin/promtool prom/prometheus:v3.5.0 test rules alerts.test.yml
      - name: Run unit, architecture and integration tests
        run: ./mvnw --batch-mode --no-transfer-progress -Pintegration verify
      - name: Restore a real backup into isolated PostgreSQL
        run: python3 -B docs/dev-ops/compose/test-restore-ip.py --jar WuhouCake-bootstrap/target/WuhouCake-bootstrap-*.jar
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backend-test-reports
          path: |
            **/target/surefire-reports/
            **/target/failsafe-reports/
          if-no-files-found: warn
          retention-days: 7

  frontend:
    name: Frontend tests and build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  browser:
    name: Browser recovery regressions
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      DRAFT_BROWSER_CHANNEL: headless-shell
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6.1.4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build backend for isolated smoke test
        run: ./mvnw --batch-mode --no-transfer-progress -DskipTests package
      - name: Install pinned browser and dependencies
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps --only-shell chromium
      - name: Exercise permission revocation and submission recovery
        env:
          WUHOU_BROWSER_TRACE_DIR: ${{ runner.temp }}/wuhou-browser-traces
        run: python3 -B docs/dev-ops/compose/test-browser-receipt.py --jar WuhouCake-bootstrap/target/WuhouCake-bootstrap-*.jar
      - name: Upload browser traces on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-traces
          path: ${{ runner.temp }}/wuhou-browser-traces
          if-no-files-found: ignore
          retention-days: 7
