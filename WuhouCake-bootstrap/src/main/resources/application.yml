spring:
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  application:
    name: wuhoucake
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  datasource:
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      connection-timeout: 5000
  flyway:
    enabled: true
    default-schema: public
    locations: classpath:db/migration
    clean-disabled: true
  data:
    redis:
      timeout: 2s
      connect-timeout: 2s

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

wuhoucake:
  order-recognition:
    assist:
      enabled: ${RECOGNITION_ASSIST_ENABLED:false}
      api-key: ${DASHSCOPE_API_KEY:}
      base-url: ${RECOGNITION_ASSIST_BASE_URL:}
      model-id: ${RECOGNITION_ASSIST_MODEL:qwen3.7-flash}
      timeout-millis: ${RECOGNITION_ASSIST_TIMEOUT_MILLIS:8000}
      max-concurrent: ${RECOGNITION_ASSIST_MAX_CONCURRENT:2}
  identity:
    private-key: ${IDENTITY_PRIVATE_KEY:}
    public-key: ${IDENTITY_PUBLIC_KEY:}
    secure-cookie: true
    access-lifetime: 15m
    session-lifetime: 7d
  security:
    permit-api-docs: false
